{% extends "base.html" %} {% block title %}Sign Up{% endblock %} {% block
content %}
<h1>Sign Up</h1>
<form method="POST" action="{{ url_for('auth.signup') }}" class="form-card">
  <label for="username">Username</label>
  <input
    type="text"
    id="username"
    name="username"
    autocomplete="username"
    required
  />
  <label for="phone_number">Phone Number</label>
  <input
    type="tel"
    id="phone_number"
    name="phoneNumber"
    autocomplete="tel"
    required
  />
  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="email" required />
  <label for="password">Password <small>(8 characters minimum)</small></label>
  <input
    type="password"
    id="password"
    name="password"
    autocomplete="new-password"
    minlength="8"
    required
  />
  <button type="submit">Sign Up</button>
</form>
{% endblock %}
